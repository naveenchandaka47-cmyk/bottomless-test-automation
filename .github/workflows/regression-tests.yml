name: Automated Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run TestNG Regression Suite Headless
        run: |
          mvn clean test -Dheadless=true -DsuiteXmlFile=testng-regression.xml

      - name: Archive Test Reports & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-execution-reports
          path: |
            reports/
            logs/
            target/surefire-reports/
          retention-days: 14
